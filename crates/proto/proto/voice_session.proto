syntax = "proto3";

package alia.voice.v2;

// Persistent capture and turn evidence. Audio is uploaded during speaking and
// playback; this is not a model-native incremental decoder or a playback RPC.
service VoiceSession {
  rpc Stream(stream DeviceFrame) returns (stream SessionEvent);
}

message DeviceFrame {
  oneof payload {
    OpenSession open = 1;
    CaptureFrame audio = 2;
    CloseSession close = 3;
    RefreshAuth refresh_auth = 4;
  }
}

message OpenSession {
  uint32 protocol_version = 1; // Must be 2.
  string device_boot_id = 2;  // UUID freshly generated by the device runtime.
  string channel_id = 3;      // Must match authenticated binding.
  bool software_hold = 4;     // Required; paired playback v3 contract.
  uint64 max_hold_ms = 5;     // Device engineering limit, not a requested timeout.
}

message CaptureFrame {
  uint64 sequence = 1;       // Starts at zero, strictly contiguous.
  uint64 sample_offset = 2;  // Monotonic sample clock from session start.
  bytes pcm_s16le = 3;       // Mono 16 kHz, at most 100 ms per frame.
  bool speech_active = 4;    // Device VAD evidence, not a turn-end decision.
}

message CloseSession {}
message RefreshAuth { string bearer_token = 1; }

message SessionEvent {
  string session_id = 1;     // Server-assigned UUID; epochs are scoped to it.
  string device_boot_id = 2;
  uint64 generation_epoch = 3;
  oneof payload {
    SessionReady ready = 4;
    TurnEvidence evidence = 5;
  }
}

message SessionReady {
  uint32 protocol_version = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  uint32 max_frame_samples = 4;
  bool software_hold = 5;     // Required; no implicit old WAIT compatibility.
  uint64 max_hold_ms = 6;     // Negotiated engineering upper bound.
}

message TurnEvidence {
  string request_id = 1;
  uint64 through_sequence = 2;
  string transcript = 3;
  TurnState state = 4;
  bool response_enqueued = 5; // Accepted by bounded pipeline, not delivered.
  double inference_ms = 6;
  OutputDecision output_decision = 7; // Semantic request; never an Applied/Held receipt.
}

// Only the independent registered Playback.Control RPC may change a hold.
enum OutputDecision {
  OUTPUT_DECISION_UNSPECIFIED = 0;
  OUTPUT_DECISION_UNCHANGED = 1;
  OUTPUT_DECISION_PAUSE_REQUESTED = 2;
  OUTPUT_DECISION_RESUME_REQUESTED = 3;
  OUTPUT_DECISION_CANCELLED = 4;
}

enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  TURN_STATE_COMPLETE = 1;
  TURN_STATE_INCOMPLETE = 2;
  TURN_STATE_BACKCHANNEL = 3;
  TURN_STATE_WAIT = 4;
}
