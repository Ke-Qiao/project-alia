syntax = "proto3";

package alia.audio;

service AudioStream {
  // Upstream: Pi recording → Server (for STT)
  rpc UploadAudio(stream AudioChunk) returns (AudioUploadResponse);

  // Downstream: Server TTS → Pi playback
  rpc PlayAudio(PlayAudioRequest) returns (stream AudioChunk);

  // Control: stop whatever is currently being played on the Pi.
  rpc StopPlayback(StopPlaybackRequest) returns (PlaybackControlResponse);

  // Full-duplex: real-time conversation after wake word
  rpc BiDirectionalAudio(stream AudioFrame) returns (stream AudioFrame);
}

// Server-hosted ingress: Pi captured speech → alia-server pipeline.
service ServerAudioIngress {
  rpc UploadCapturedAudio(stream CapturedAudioChunk) returns (AudioUploadResponse);
  rpc InterruptActiveTurn(InterruptActiveTurnRequest) returns (TurnInterruptResponse);
  rpc ReportSensorData(SensorDataRequest) returns (SensorDataResponse);
}

// Full-duplex frame supporting audio data and control signaling
message AudioFrame {
  oneof payload {
    AudioChunk audio = 1;
    AudioControl control = 2;
  }
}

message AudioControl {
  AudioControlType type = 1;
}

enum AudioControlType {
  AUDIO_CONTROL_START_SPEAKING = 0;
  AUDIO_CONTROL_STOP_SPEAKING = 1;
  AUDIO_CONTROL_CANCEL = 2;
  AUDIO_CONTROL_INTERRUPT = 3; // Interrupt current TTS playback
}

message AudioChunk {
  bytes opus_data = 1;
  uint64 sequence = 2;
  uint64 timestamp_us = 3;
  AudioEncoding encoding = 4;
}

message CapturedAudioChunk {
  AudioChunk chunk = 1;
  string channel_id = 2;
  string user_id = 3;
  uint32 sample_rate = 4;
  uint32 channels = 5;
}

enum AudioEncoding {
  AUDIO_ENCODING_OPUS = 0;
  AUDIO_ENCODING_PCM_S16LE = 1; // Fallback: raw PCM (debug)
}

message PlayAudioRequest {
  string request_id = 1;
  string source = 2; // "tts" | "notification" | "music"
  AudioEncoding encoding = 3;
  uint32 sample_rate = 4;
  bool interrupt_current = 5;
}

message AudioUploadResponse {
  bool accepted = 1;
}

message StopPlaybackRequest {
  string request_id = 1;
  string reason = 2;
}

message PlaybackControlResponse {
  bool accepted = 1;
}

message InterruptActiveTurnRequest {
  string channel_id = 1;
  string user_id = 2;
  string reason = 3;
  uint64 timestamp_us = 4;
}

message TurnInterruptResponse {
  bool accepted = 1;
  bool interrupted = 2;
}

message SensorDataRequest {
  string channel_id = 1;
  string sensor_type = 2;
  string value_json = 3;
  uint64 timestamp_us = 4;
}

message SensorDataResponse {
  bool accepted = 1;
  string sensor_id = 2;
}
