syntax = "proto3";

package alia.settings;

import "google/protobuf/empty.proto";

service EmbeddedSettings {
  rpc GetSettings(google.protobuf.Empty) returns (SettingsSnapshot);
  rpc UpdateSettings(UpdateSettingsRequest) returns (SettingsSnapshot);
  rpc ListDirectResponses(google.protobuf.Empty) returns (DirectResponseList);
  rpc UpsertDirectResponse(DirectResponseRule) returns (DirectResponseRule);
  rpc DeleteDirectResponse(DeleteDirectResponseRequest) returns (DeleteDirectResponseResponse);
}

message UpdateSettingsRequest {
  string settings_json = 1;
}

message SettingsSnapshot {
  string settings_json = 1;
  bool provisioning_mode = 2;
  bool requires_restart = 3;
  string settings_path = 4;
}

message DirectResponseRule {
  int64 id = 1;
  repeated string keywords = 2;
  string audio_path = 3;
  string action = 4;
  bool enabled = 5;
}

message DirectResponseList {
  repeated DirectResponseRule rules = 1;
  bool requires_restart = 2;
}

message DeleteDirectResponseRequest {
  int64 id = 1;
}

message DeleteDirectResponseResponse {
  bool success = 1;
  bool requires_restart = 2;
}
