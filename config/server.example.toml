# Alia Server Configuration
# ─────────────────────────────────────────────────────────────────────
# Config search order:
#   1. ALIA_CONFIG_PATH env var
#   2. ./config/server.toml  (relative to CWD)
#   3. ~/.config/alia/server.toml  (XDG / macOS Library)
#   4. /etc/alia/server.toml
#
# This base file is loaded first, then fragments from ./server.example.d/**/*.toml
# are loaded in sorted order. For a runtime config named server.toml, fragments
# live in ./server.d/**/*.toml. Relative paths are resolved from the base config
# file's directory, NOT the working directory.
# ─────────────────────────────────────────────────────────────────────

[server]
id = "alia-main"
host = "0.0.0.0"
port = 3000
log_level = "info"
debug_output = false

[database]
url = "postgres://alia:alia_dev@localhost/alia?sslmode=disable"
max_connections = 10
min_connections = 2

[auth]
jwt_secret = "change-me-in-production"
server_keypair_path = "server.key"
jwt_expiry_hours = 24
refresh_expiry_days = 30
argon2_memory_kib = 19456
argon2_iterations = 2
argon2_parallelism = 1

# Channel adapters (array, supports multiple instances)
[[channels]]
type = "embedded"
id = "pi-living-room"
enabled = true
endpoint = ""
discovery_service_name = "_alia-embedded._tcp"
discovery_timeout_sec = 3
reconnect_interval_sec = 5
reconnect_max_backoff_sec = 60
grpc_timeout_sec = 10

[modules]
llm = "openai"
stt = "whisper_cpp"
tts = "gpt_sovits"
embedding = "ollama"
memory = "graphrag"
cache = "two_layer"
skills = "builtin"
persona = "template"
meditation = "scheduled"
router = "multi_layer"
rule_engine = "simple"
scheduler = "cron"
tools = "builtin"

[skills]
# Directory containing .md skill definition files (TOML frontmatter).
# Relative paths resolve from this config file's directory.
# e.g. "../skills" → <config_dir>/../skills/ (dev layout)
#      "skills"    → <config_dir>/skills/     (deployed layout)
skills_dir = "../skills"

[rules]
evaluation_interval_sec = 10
max_rules_per_user = 50

[scheduler]
enabled = true
max_tasks_per_user = 100
max_subscriptions_per_user = 50
tick_interval_sec = 1
missed_task_policy = "skip"
task_timeout_sec = 30
max_concurrent_tasks = 5

[tools]
max_tool_call_depth = 5
tool_call_timeout_sec = 30
allow_plugin_tools = true
require_confirmation = []
