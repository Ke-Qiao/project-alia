# Alia Server Configuration
# ─────────────────────────────────────────────────────────────────────
# Config search order:
#   1. ALIA_CONFIG_PATH env var
#   2. ./config/server.toml  (relative to CWD)
#   3. ~/.config/alia/server.toml  (XDG / macOS Library)
#   4. /etc/alia/server.toml
#
# This base file owns instance-level settings and LLM role binding.
# Implementation details live in ./server.example.d/**/*.toml and are
# deep-merged in sorted order. For a runtime config named server.toml,
# fragments live in ./server.d/**/*.toml. Prefer semantic folders such as
# providers/, policies/, profiles/, resources/, and future plugins/.
# Relative paths are resolved from the base config file's directory, NOT the
# working directory.
# ─────────────────────────────────────────────────────────────────────

[server]
id = "alia-main"
host = "0.0.0.0"
port = 3000
# Omit for HTTP port + 1. HTTP port 0 also selects an ephemeral gRPC port.
# grpc_port = 3001
shutdown_grace_ms = 10000
drain_timeout_ms = 1000
# Set this when binding LAN embedded devices. Do not use 0.0.0.0 here.
# public_endpoint = "http://192.168.1.10:3000"
discovery_enabled = true
# Alia Server advertises the control-plane endpoint here. Keep this distinct
# from embedded nodes, which advertise "_alia-embedded._tcp".
discovery_service_name = "_alia-server._tcp"
# discovery_instance_name = "Alia Main"
log_level = "info"
debug_output = false

[database]
url = "postgres://alia:alia_dev@localhost/alia?sslmode=disable"
max_connections = 10
min_connections = 2

[auth]
jwt_secret = "change-me-in-production"
server_keypair_path = "server.key"
jwt_expiry_hours = 24
refresh_expiry_days = 30
argon2_memory_kib = 19456
argon2_iterations = 2
argon2_parallelism = 1

# Channel adapters (array, supports multiple instances)
[[channels]]
type = "embedded"
id = "pi-living-room"
enabled = true
# Set to an existing active account UUID before voice input is enabled.
# The authenticated account API returns its user ID. Never use a device-supplied ID.
# owner_user_id = "<existing-account-uuid>"
# Body commands additionally require both values read from the trusted device
# locally. Discovery/GetBindingStatus never populates or replaces this pin.
# expected_device_id = "<verified-device-id>"
# expected_device_public_key = "<base64-encoded-32-byte-Ed25519-public-key>"
# Local operator-reviewed animation pins, matched independently on the device.
# Empty keeps file animations unavailable; built-in gestures keep their policy.
# Never copy a digest from model output or automatically trust existing files.
approved_animations = []
# Example only after review: approved_animations = [
#   { file = "reviewed.anim", version = 1, sha256 = "<64-lowercase-hex>", bytes = 123 }
# ]
endpoint = ""
discovery_service_name = "_alia-embedded._tcp"
discovery_timeout_sec = 3
reconnect_interval_sec = 5
reconnect_max_backoff_sec = 60
grpc_timeout_sec = 10

[modules]
stt = "whisper_cpp"
tts = "gpt_sovits"

[llm.roles]
minor = "minor"
major = "major"
default = "major"
embedding = "embedding"
# Optional dedicated LLM for selective memory capture. Omit to fall back to the
# configured minor LLM.
# memory_capture = "memory_capture"
# Optional dedicated LLM for sentence-level TTS expression judgement. Omit to
# use deterministic expression rules only.
sentence_expression = "sentence_expression"
