[stt]
adapter = "whisper_cpp"
whisper_cpp_endpoint = "http://localhost:8080"
whisper_cpp_model = "large-v3"

[tts]
adapter = "gpt_sovits"
gpt_sovits_endpoint = "http://localhost:9880/tts"
# Model names and paths are resolved on the remote GPT-SoVITS server.
gpt_sovits_model_name = "default"
gpt_sovits_gpt_weights_path = ""
gpt_sovits_sovits_weights_path = ""
gpt_sovits_ref_audio_path = ""
gpt_sovits_aux_ref_audio_paths = []
gpt_sovits_prompt_text = ""
gpt_sovits_language = "zh"
gpt_sovits_text_split_method = "cut5"
gpt_sovits_batch_size = 1
gpt_sovits_batch_threshold = 0.75
gpt_sovits_split_bucket = true
gpt_sovits_speed_factor = 1.0
gpt_sovits_fragment_interval = 0.3
gpt_sovits_seed = -1
gpt_sovits_parallel_infer = true
gpt_sovits_repetition_penalty = 1.35
gpt_sovits_sample_steps = 32
gpt_sovits_super_sampling = false
gpt_sovits_overlap_length = 2
gpt_sovits_min_chunk_length = 16
