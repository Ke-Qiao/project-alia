[policies.insights]
enabled = true
extraction_enabled = false
consolidation_idle_minutes = 30
reflection_schedule = "0 0 3 * * *"
habit_detection_schedule = "0 0 4 * * *"
memory_threshold = 50
max_concurrent_insights = 1
presence_sensor_id = "presence"
conditions = []

# English prompts because scheduled memory tasks are structured internal jobs.
memory_extraction_prompt = "You extract durable user memories from conversations. Only store facts, preferences, stable profile details, and recurring needs explicitly stated or strongly confirmed by the user. Do not store one-off requests, assistant guesses, secrets, current time/weather/news, tool results, or anything uncertain. Never store credentials, identifiers, health details, religious views, political views, or other sensitive personal data unless the user explicitly used a direct memory-management action. Return exactly one JSON object: {\"memories\":[{\"content\":\"...\",\"memory_layer\":\"core|preference|episodic|relationship\",\"node_type\":\"fact|preference|relationship|goal|habit|event\",\"importance\":0.0-1.0,\"confidence\":0.0-1.0,\"reason\":\"...\"}]}"
memory_consolidation_prompt = "You consolidate a user's memory store for a personal assistant. Merge duplicates, refine wording, retire contradicted or low-value episodic noise, and create concise durable memories when needed. Retirement preserves source evidence; physical deletion is reserved for explicit user forget actions. Keep the configured assistant memory policy in charge: be conservative, preserve user intent, and never retire or rewrite if unsure. Do not create or keep credentials, identifiers, health details, religious views, political views, or sensitive speculation from chat-derived memory. Return exactly one JSON object with keys: summary, updates, retirements, creates. updates items: {\"id\":\"existing id\",\"content\":\"optional refined content\",\"importance\":0.0-1.0,\"reason\":\"...\"}. retirements items: {\"id\":\"existing id\",\"status\":\"superseded|rejected\",\"reason\":\"...\"}. Each existing id may occur at most once across updates and retirements. creates use the same fields as memory extraction candidates."
reflection_prompt = "You produce durable internal insights for a personal assistant. Identify stable preferences, habits, long-term goals, and relationship context that will improve future conversations. Do not invent facts. Avoid sensitive speculation and do not store secrets or sensitive personal categories from chat-derived context. Return exactly one JSON object: {\"memories\":[{\"content\":\"...\",\"memory_layer\":\"reflection|core|preference|relationship\",\"node_type\":\"insight|habit|preference|goal|relationship\",\"importance\":0.0-1.0,\"confidence\":0.0-1.0,\"reason\":\"...\"}]}"
habit_detection_prompt = "You detect durable user habits for a personal assistant. Extract only recurring behaviors, repeated preferences, routines, or stable interaction patterns that are supported by the provided memory/conversation context. Do not invent routines from a single weak clue. Do not store sensitive personal categories from chat-derived context. Return exactly one JSON object: {\"memories\":[{\"content\":\"...\",\"memory_layer\":\"reflection|preference\",\"node_type\":\"habit|preference|goal\",\"importance\":0.0-1.0,\"confidence\":0.0-1.0,\"reason\":\"...\"}]}"
