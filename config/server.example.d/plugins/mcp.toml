# MCP services are disabled unless enabled is explicitly true. Copy a block and
# replace the non-nil user_id with the Alia account that owns the service token.
# Only that account sees/calls this service's tools. Remote annotations never
# disable the host's confirmation or role policy.
#
# [[plugins.mcp]]
# id = "notes"
# enabled = false
# user_id = "11111111-1111-4111-8111-111111111111"
# require_confirmation = true
# legacy = false
# [plugins.mcp.transport]
# type = "http"
# url = "https://mcp.example.invalid/mcp"
# token_env = "ALIA_NOTES_MCP_TOKEN"
#
# A stdio service runs with host account permissions. Only use a trusted native
# executable; this is not a WASM sandbox. The executable is copied after its hash
# is verified; script interpreters, libraries and paths passed in args remain
# part of the administrator's explicitly trusted deployment.
#
# [[plugins.mcp]]
# id = "local_notes"
# enabled = false
# user_id = "11111111-1111-4111-8111-111111111111"
# require_confirmation = true
# legacy = true
# [plugins.mcp.transport]
# type = "stdio"
# program = "/absolute/path/to/trusted-mcp-server"
# executable_sha256 = "REPLACE_WITH_64_LOWERCASE_HEX_SHA256"
# allow_host_execution = true
# args = []
# env = {} # Environment is cleared first; pass only explicitly needed variables.
