# config/embedded.toml — Runtime-editable settings for alia-embedded
#
# The device now boots with compiled defaults when this file is missing.
# Server/frontend OOBE can create or update this file over the settings API.
#
# User-editable sections:
# - [runtime]
# - [identity]
# - [audio]
# - [audio_debug]
# - [edge_stt]
# - [vad]
# - [interrupt]
# - [continuous_dialogue]
# - [hmmd_mmwave]
# - [motion]
# - [vision]
# - [discovery]

[runtime]
provisioned = false

[identity]
device_id = "alia-embedded-a1b2c3d4e5f6"
device_name = "客厅助手"
keypair_path = "device.key"

[wakeword]
engine = "sherpa-onnx"
model_path = "models/hey_alia.onnx"
encoder_path = "models/sherpa-kws/encoder.onnx"
decoder_path = "models/sherpa-kws/decoder.onnx"
joiner_path = "models/sherpa-kws/joiner.onnx"
tokens_path = "models/sherpa-kws/tokens.txt"
keywords_file = "models/sherpa-kws/keywords.txt"
keywords = ["玲珑"]
sensitivity = 0.6
keywords_score = 1.0
keywords_threshold = 0.25
provider = "cpu"
num_threads = 1
debug = false

[audio]
capture_backend = "auto"
capture_device = "default"
capture_sample_rate = 16000
capture_channels = 1
# Runtime volume defaults. Live values are persisted in embedded SQLite and can
# be changed over gRPC without restarting. Values are linear gain, where 1.0 is
# unchanged and values above 1.0 amplify with clipping protection.
capture_volume = 1.0
# Set `capture_backend` / `playback_backend` to `alsa` to skip CPAL entirely on
# Linux boards with fixed I2S/I2C audio devices. `auto` also switches to ALSA
# immediately when the device name uses ALSA syntax like `alsa:plughw:0,0`.
playback_backend = "auto"
playback_device = "default"
playback_sample_rate = 24000
playback_channels = 1
playback_volume = 1.0
playback_buffer_ms = 60
# Playback queue tuning. Keep the target cushion small for lower latency, and
# let the max cap guard against runaway buffering when the network outruns the
# speaker.
playback_target_buffer_ms = 300
playback_max_buffer_ms = 2000
playback_command_queue_capacity = 8
# When `true`, ALSA playback retunes to the source clip/stream sample rate.
# If the speaker amp and mic share the same Pi I2S card/clock, set
# `alsa_playback_lock_to_capture_rate = true` below instead so playback cannot
# retune the clock while capture is active. When enabled, source-rate following
# is ignored and playback audio is resampled into `capture_sample_rate`.
alsa_playback_follow_source_rate = true
alsa_playback_lock_to_capture_rate = false
# I2S mics often expose 24-bit samples inside S32_LE. `auto` detects whether
# those bits are left- or right-justified; set explicitly if a board needs it.
alsa_capture_s32_alignment = "auto"
opus_bitrate = 24000
opus_frame_ms = 20
upload_buffer_frames = 5
jitter_buffer_ms = 60

[audio_debug]
# Enable only while diagnosing audio. WAVs can grow quickly.
enabled = false
dir = "run/audio-debug"
record_capture_stream = true
record_wake_capture = true
record_playback = true
capture_segment_ms = 10000

[edge_stt]
language = "zh"
max_duration_ms = 15000
# VAD may briefly think an utterance ended while the user is still speaking.
# Do not accept a VAD endpoint before this minimum capture duration.
post_wake_min_capture_ms = 1800
post_wake_capture_ms = 2500
post_wake_response_delay_ms = 500

[vad]
model_path = "models/silero-vad/silero_vad.onnx"
sample_rate = 16000
threshold = 0.5
min_silence_duration_ms = 700
min_speech_duration_ms = 250
window_size = 512
max_speech_duration_ms = 15000
buffer_size_sec = 10.0
provider = "cpu"
num_threads = 1
debug = false

[interrupt]
interrupt_on_wakeword_during_playback = true
interrupt_skip_direct_response = true
interrupt_debounce_ms = 300

[continuous_dialogue]
# After one wake word, keep listening after each assistant reply so the user can
# continue without repeating the wake word. Follow-up capture starts only after
# VAD hears speech; silence just keeps the listening window open until timeout.
enabled = true
followup_timeout_ms = 10000
# 0 means unlimited; a small cap avoids accidentally staying active forever.
max_followup_turns = 6

[direct_response_defaults]
audio_dir = "run/direct-responses"

[hmmd_mmwave]
# Waveshare HMMD-mmWave-Sensor on UART only. Enable this on Raspberry Pi when
# the sensor TX/RX pins are wired to GPIO15/GPIO14, e.g. /dev/ttyAMA0.
enabled = false
serial_path = "/dev/ttyAMA0"
baud_rate = 115200
sensor_prefix = "hmmd"
# Send the vendor report-mode command on startup so binary frames are emitted.
configure_report_mode = true
read_timeout_ms = 200
reconnect_delay_ms = 1000
stale_after_ms = 3000
debug = false

[motion]
# Native embedded expression/motion control. The Rust runtime owns neck mapping,
# trajectories, cancellation, and PCA9685 output.
enabled = true
neck_config_file = "../packages/alia-embedded/assets/neck/controller/neck_matrix_config.json"
animation_dir = "../packages/alia-embedded/assets/neck/anim_data"
servo_count = 8
i2c_device = "/dev/i2c-1"
pca9685_addresses = [64]
pca_frequency_hz = 50
min_pulse_us = 500
max_pulse_us = 2500
# Keep false for development; set true on the Pi after I2C/PCA9685 wiring is verified.
hardware_enabled = false
fps = 30
center_angle = 90.0
face_max_yaw = 25.0
face_max_pitch = 18.0
face_deadzone = 0.04
face_smooth_alpha = 0.2
face_center_offset_x = 0.0
face_center_offset_y = 0.0
face_camera_roll_deg = 0.0

[vision]
# Rust/OpenCV YuNet face tracking. Build alia-embedded with
# `--features vision-opencv` on the Pi and place the ONNX model at this path.
enabled = true
camera_index = 0
camera_width = 640
camera_height = 480
capture_fps = 30.0
detector_fps = 12
yunet_model_path = "models/vision/face_detection_yunet_2023mar.onnx"
input_width = 320
input_height = 320
score_threshold = 0.75
nms_threshold = 0.3
top_k = 256
min_motion_interval_ms = 80
min_face_delta_px = 6.0

[discovery]
mdns_enabled = true
mdns_service_name = "_alia-embedded._tcp"
mdns_instance_name = "客厅助手"
# BLE provisioning is an auxiliary phone-nearby beacon. mDNS remains the primary
# server discovery path. On Raspberry Pi this requires a running BlueZ daemon,
# an unblocked Bluetooth controller, LE advertising support, and NetworkManager
# `nmcli` when using BLE Wi-Fi setup.
ble_provision_enabled = true
ble_provision_timeout_sec = 300
require_physical_confirm = true
max_bind_attempts = 3
lockout_duration_sec = 600
reconnect_interval_sec = 5
reconnect_max_backoff_sec = 60

[dev]
# Local development only: seed binding state so embedded can upload captured
# audio to alia-server without completing the normal binding handshake.
skip_binding = false
server_id = "alia-local-dev"
server_name = "alia-local-dev"
server_endpoint = "http://127.0.0.1:3000"
