# config/embedded.toml — Runtime-editable settings for alia-embedded
#
# The device now boots with compiled defaults when this file is missing.
# Server/frontend OOBE can create or update this file over the settings API.
#
# User-editable sections:
# - [runtime]
# - [identity]
# - [audio]
# - [edge_stt]
# - [vad]
# - [discovery]

[runtime]
provisioned = false

[identity]
device_id = "alia-embedded-a1b2c3d4e5f6"
device_name = "客厅助手"
keypair_path = "device.key"

[audio]
capture_backend = "auto"
capture_device = "default"
capture_sample_rate = 16000
capture_channels = 1
# Set `capture_backend` / `playback_backend` to `alsa` to skip CPAL entirely on
# Linux boards with fixed I2S/I2C audio devices. `auto` also switches to ALSA
# immediately when the device name uses ALSA syntax like `alsa:plughw:0,0`.
playback_backend = "auto"
playback_device = "default"
playback_sample_rate = 24000
playback_channels = 1
playback_buffer_ms = 60
opus_bitrate = 24000
opus_frame_ms = 20
upload_buffer_frames = 5
jitter_buffer_ms = 60

[edge_stt]
max_duration_ms = 5000
post_wake_capture_ms = 2500
post_wake_response_delay_ms = 700

[vad]
model_path = "models/silero-vad/silero_vad.onnx"
sample_rate = 16000
threshold = 0.5
min_silence_duration_ms = 700
min_speech_duration_ms = 250
window_size = 512
max_speech_duration_ms = 5000
buffer_size_sec = 10.0
provider = "cpu"
num_threads = 1
debug = false

[direct_response_defaults]
audio_dir = "run/direct-responses"

[discovery]
mdns_enabled = true
mdns_service_name = "_alia-embedded._tcp"
mdns_instance_name = "客厅助手"
ble_provision_enabled = true
ble_provision_timeout_sec = 300
require_physical_confirm = true
max_bind_attempts = 3
lockout_duration_sec = 600
reconnect_interval_sec = 5
reconnect_max_backoff_sec = 60

[dev]
# Local development only: seed binding state so embedded can upload captured
# audio to alia-server without completing the normal binding handshake.
skip_binding = false
server_id = "alia-local-dev"
server_name = "alia-local-dev"
server_endpoint = "http://127.0.0.1:3000"
