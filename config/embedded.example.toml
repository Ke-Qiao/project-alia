# config/embedded.toml — Runtime-editable settings for alia-embedded
#
# The device now boots with compiled defaults when this file is missing.
# Server/frontend OOBE can create or update this file over the settings API.
#
# User-editable sections:
# - [runtime]
# - [identity]
# - [audio]
# - [discovery]

[runtime]
provisioned = false

[identity]
device_id = "alia-embedded-a1b2c3d4e5f6"
device_name = "客厅助手"
keypair_path = "device.key"

[audio]
capture_device = "default"
capture_sample_rate = 16000
capture_channels = 1
playback_device = "default"
playback_sample_rate = 24000
playback_channels = 1
playback_buffer_ms = 60
opus_bitrate = 24000
opus_frame_ms = 20
upload_buffer_frames = 5
jitter_buffer_ms = 60

[discovery]
mdns_enabled = true
mdns_service_name = "_alia-embedded._tcp"
mdns_instance_name = "客厅助手"
ble_provision_enabled = true
ble_provision_timeout_sec = 300
require_physical_confirm = true
max_bind_attempts = 3
lockout_duration_sec = 600
reconnect_interval_sec = 5
reconnect_max_backoff_sec = 60
