[package]
name = "alia-wasm-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = { version = "=1.4.1", default-features = false }
alia-plugin-api = { path = "../../crates/alia-plugin-api" }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
