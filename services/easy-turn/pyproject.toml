[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alia-easy-turn"
version = "0.1.0"
description = "Local, persistent Easy-Turn inference for Alia Server"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
model = [
  "torch==2.2.2",
  "torchaudio==2.2.2",
  "numpy==1.26.4",
  "transformers==4.44.2",
  "peft==0.13.2",
  "accelerate==0.34.2",
  "huggingface-hub==0.34.4",
  "librosa==0.10.2.post1",
  "scikit-learn==1.5.2",
  "openai-whisper==20240930",
  "gxl-ai-utils==1.6.1",
  "PyYAML==6.0.2",
]

[project.scripts]
alia-easy-turn = "alia_easy_turn.__main__:main"
alia-easy-turn-prepare = "alia_easy_turn.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]
