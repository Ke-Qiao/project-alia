[package]
name = "alia-embedded"
version.workspace = true
edition.workspace = true

[features]
default = ["wakeword-sherpa", "stt-sherpa", "direct-response"]
direct-response = []
vision-opencv = ["dep:opencv"]
sherpa-onnx = ["dep:sherpa-onnx"]
wakeword-sherpa = ["sherpa-onnx"]
stt-sherpa = ["sherpa-onnx"]

[dependencies]
alia-core.workspace = true
alia-proto.workspace = true
alia-transport.workspace = true
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
chrono.workspace = true
cpal.workspace = true
ed25519-dalek = "2.2"
futures.workspace = true
libc.workspace = true
prost.workspace = true
rand.workspace = true
opencv = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sherpa-onnx = { workspace = true, optional = true }
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zip.workspace = true
mdns-sd = "0.19"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
bluer = { version = "0.17", features = ["bluetoothd"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
