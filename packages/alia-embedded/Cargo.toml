[package]
name = "alia-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["sherpa-onnx"]
vision-opencv = ["dep:opencv"]
sherpa-onnx = ["dep:sherpa-onnx", "dep:ort", "dep:ort-sys"]
test-support = []

[dependencies]
alia-core.workspace = true
alia-proto.workspace = true
alia-transport.workspace = true
alia-plugin-api.workspace = true
alia-plugin-runtime.workspace = true
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
base64 = "0.22.1"
chrono.workspace = true
cpal.workspace = true
ed25519-dalek = "2.2"
futures.workspace = true
libc.workspace = true
prost.workspace = true
rand.workspace = true
rubato = { version = "=5.0.0", default-features = false }
opencv = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sherpa-onnx = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24"], optional = true }
# Reuse ONNX Runtime linked by sherpa-onnx; do not download a second runtime.
ort-sys = { version = "=2.0.0-rc.12", default-features = false, features = ["disable-linking", "api-24"], optional = true }
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zip.workspace = true
mdns-sd = "0.19"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
bluer = { version = "0.17", features = ["bluetoothd"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
