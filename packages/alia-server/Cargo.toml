[package]
name = "alia-server"
version.workspace = true
edition.workspace = true

[features]
default = [
    "channel-embedded",
    "llm-openai", "llm-anthropic", "llm-gemini",
    "stt-whisper", "tts-sovits",
    "embed-openai",
    "tools-http",
    "insights",
    "plugin-home-assistant",
    "turn-easy",
]

# Channel adapters
channel-embedded = ["dep:alia-proto", "dep:tonic", "dep:alia-transport"]

# LLM backends
llm-openai = ["dep:reqwest"]
llm-anthropic = ["dep:reqwest"]
llm-gemini = ["dep:reqwest"]

# STT / TTS backends
stt-whisper = ["dep:reqwest"]
tts-sovits = ["dep:reqwest"]

# Embedding backends
embed-openai = ["dep:reqwest"]

# Built-in tools
tools-http = ["dep:reqwest"]

# Insights system
insights = []
turn-easy = ["dep:reqwest"]

# Demo LLM tool plugins
plugin-home-assistant = ["dep:reqwest"]

[dependencies]
alia-core.workspace = true
alia-proto = { workspace = true, optional = true }
alia-transport = { workspace = true, optional = true }

# Async runtime
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true

# HTTP framework
axum.workspace = true
tower-http.workspace = true

# gRPC (optional, only for embedded channel)
tonic = { workspace = true, optional = true }

# Database
sea-orm.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true
ed25519-dalek = "2.2"

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Auth
jsonwebtoken.workspace = true
argon2.workspace = true

# OpenAPI
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true

# Template engine
handlebars.workspace = true

# Cron scheduling
cron.workspace = true

# Async streaming
async-stream.workspace = true

# Cryptography
sha2.workspace = true

# Vector database
pgvector.workspace = true

# HTTP client (optional, for AI adapters)
reqwest = { workspace = true, optional = true }
base64 = "0.22.1"
rand.workspace = true

# CLI REPL
crossterm = "0.29"

# Platform directories
dirs = "6"

# Network
network-interface.workspace = true
mdns-sd.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
