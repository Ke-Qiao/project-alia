[workspace]
resolver = "2"
members = [
    "packages/alia-server",
    "packages/alia-embedded",
    "crates/proto",
    "crates/transport",
    "crates/alia-core",
    "crates/alia-plugin-api",
    "crates/alia-plugin-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
# Shared crates
alia-core = { path = "crates/alia-core" }
alia-proto = { path = "crates/proto" }
alia-transport = { path = "crates/transport" }
alia-plugin-api = { path = "crates/alia-plugin-api" }
alia-plugin-runtime = { path = "crates/alia-plugin-runtime" }
network-interface = "1.1"
mdns-sd = "0.19"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt", "codec", "io"] }
futures = "0.3"

# gRPC / Protobuf
tonic = "0.13"
tonic-build = "0.13"
prost = "0.13"

# HTTP
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Database
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
sherpa-onnx = "1.13"
cpal = "0.15"
opencv = { version = "0.98.2", default-features = false, features = ["clang-runtime", "dnn", "imgcodecs", "imgproc", "objdetect", "videoio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / Serialization
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Auth / Security
jsonwebtoken = "9"
argon2 = "0.5"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart", "query"] }

# Agent, typed tools and external tool protocols
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.44.0", default-features = false }
rig-reqwest = { version = "=0.44.0", default-features = false, features = ["rustls"] }
rig-typesafeai = { version = "=0.44.0", default-features = false }
schemars = { version = "=1.2.3", default-features = false, features = ["std", "derive"] }
jsonschema = { version = "=0.59.0", default-features = false }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
sse-stream = "=0.2.6"
extism = { version = "=1.41.0", default-features = false }
html-to-markdown-rs = { version = "=3.17.2", default-features = false }

# Template engine
handlebars = "6"

# Cron scheduling
cron = "0.15"

# Async streaming
async-stream = "0.3"

# Cryptography
sha2 = "0.10"

# Vector database
pgvector = { version = "0.4", features = ["sqlx"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Async utilities
async-trait = "0.1"

# CLI / REPL

# Unix
libc = "0.2"

[patch.crates-io]
extism = { path = "vendor/extism" }
rig-core = { git = "https://github.com/Ke-Qiao/rig.git", rev = "c2ff3e30e6b8d84fc6759eab030656a42cae14ca" }
rig-agent = { git = "https://github.com/Ke-Qiao/rig.git", rev = "c2ff3e30e6b8d84fc6759eab030656a42cae14ca" }
rig-http = { git = "https://github.com/Ke-Qiao/rig.git", rev = "c2ff3e30e6b8d84fc6759eab030656a42cae14ca" }
rig-reqwest = { git = "https://github.com/Ke-Qiao/rig.git", rev = "c2ff3e30e6b8d84fc6759eab030656a42cae14ca" }
rig-typesafeai = { git = "https://github.com/Ke-Qiao/rig.git", rev = "c2ff3e30e6b8d84fc6759eab030656a42cae14ca" }

# Runtime tests hash the full executable inside bounded child-process startup.
[profile.dev.package.sha2]
opt-level = 3
